services:
  lpdg-ml:
    build: .
    volumes:
      - ./data:/app/data:ro
      - ./outputs:/app/outputs
    command: >
      sh -c "
      python baseline_3sigma.py
      --data /app/data
      --out /app/outputs/predictions.csv
      &&
      python validate_submission.py
      /app/outputs/predictions.csv
      "